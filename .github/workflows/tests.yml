name: tests

on:
  push:
  pull_request:

jobs:
  # System tests need the hardware and run on the bench, see docs/test-plan.md
  module-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tests/requirements.txt
      - name: Run module tests
        run: pytest tests/module --html=report-module.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-test-report
          path: report-module.html
