name: build

on:
  push:
  pull_request:

jobs:
  firmware-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [normal, demo]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build node firmware (${{ matrix.variant }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32
          path: firmware/node
          command: >-
            ${{ matrix.variant == 'demo'
              && 'idf.py -B build-demo -D SDKCONFIG=build-demo/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.demo" build'
              || 'idf.py build' }}
